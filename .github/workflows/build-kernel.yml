name: Build Kernel J1 Ace (Auto-Release)

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - android-5.1.1

# Memberikan izin kepada robot GitHub untuk membuat halaman Release
permissions:
  contents: write

env:
  DEFCONFIG_NAME: j1acevelte_defconfig
  ARCH: arm
  SUBARCH: arm

jobs:
  build:
    name: Compile Kernel
    runs-on: ubuntu-22.04

    steps:
    - name: 1. Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        path: kernel-source

    - name: 2. Install Dependencies & 32-bit Library
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32z1-dev liblz4-tool libncurses5 libncurses-dev libssl-dev libxml2 libxml2-utils lzop rsync schedtool xsltproc zip zlib1g-dev python2 libc6:i386 libncurses5:i386 libstdc++6:i386
        sudo ln -sf /usr/bin/python2 /usr/bin/python

    - name: 3. Download Toolchain (GCC 4.9 LineageOS - Diperbaiki)
      run: |
        git clone --depth=1 -b lineage-19.1 https://github.com toolchain

    - name: 4. Auto-Patch Fixer & Matikan Keamanan Samsung
      run: |
        cd kernel-source
        echo "Menjalankan perbaikan otomatis tingkat lanjut..."
        
        if [ -f kernel/timeconst.pl ]; then
          sed -i 's/if (!defined(@val))/if (!@val)/g' kernel/timeconst.pl
        fi
        
        if [ -f scripts/dtc/dtc-lexer.lex.c_shipped ]; then
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.lex.c_shipped
        fi
        
        find . -type f -name "Makefile" -exec sed -i 's/-Werror//g' {} +
        find . -type f -name "Makefile" -exec sed -i 's/-implicit-function-declaration/-Wno-implicit-function-declaration/g' {} +
        
        sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/g' arch/arm/configs/$DEFCONFIG_NAME
        
        # --- MENGATUR PARAMETER SELINUX & MATIKAN KEAMANAN SAMSUNG ---
        echo "Menghapus proteksi Knox, TIMA, dan memaksa status Permissive di defconfig..."
        
        # Izinkan modifikasi SELinux via boot argument (cmdline)
        sed -i 's/CONFIG_SECURITY_SELINUX_DEVELOP=y/CONFIG_SECURITY_SELINUX_DEVELOP=y\nCONFIG_SECURITY_SELINUX_BOOTPARAM=y/g' arch/arm/configs/$DEFCONFIG_NAME
        
        # Matikan fitur pemaksaan Enforcing bawaan kernel
        sed -i 's/CONFIG_SECURITY_SELINUX_ENFORCE=y/CONFIG_SECURITY_SELINUX_ENFORCE=n/g' arch/arm/configs/$DEFCONFIG_NAME
        
        # Nonaktifkan Knox, TIMA, dan RKP Keamanan Samsung
        sed -i 's/CONFIG_TIMA=y/CONFIG_TIMA=n/g' arch/arm/configs/$DEFCONFIG_NAME
        sed -i 's/CONFIG_KNOX_KAP=y/CONFIG_KNOX_KAP=n/g' arch/arm/configs/$DEFCONFIG_NAME
        sed -i 's/CONFIG_SECURITY_TIMA=y/CONFIG_SECURITY_TIMA=n/g' arch/arm/configs/$DEFCONFIG_NAME

    - name: 5. Mulai Compile Kernel
      run: |
        cd kernel-source
        
        export CROSS_COMPILE=$GITHUB_WORKSPACE/toolchain/bin/arm-linux-androideabi-
        export ARCH=arm
        export SUBARCH=arm
        export KBUILD_BUILD_USER="Icsriyand"
        export KBUILD_BUILD_HOST="GitHub-Actions"
        
        make $DEFCONFIG_NAME
        make -j$(nproc)

    - name: 6. Kemas Hasil Build dengan AnyKernel3 & Set Permissive
      run: |
        # Unduh AnyKernel3 dari repositori resmi osm0sis
        git clone --depth=1 https://github.com AnyKernel3
        
        # Bersihkan berkas templat bawaan yang tidak terpakai
        rm -f AnyKernel3/README.md AnyKernel3/zImage AnyKernel3/Image.gz-dtb
        
        # Salin file kernel utama (zImage) ke root folder AnyKernel3
        cp kernel-source/arch/arm/boot/zImage AnyKernel3/
        
        # Buat struktur direktori modul driver Android dan salin semua berkas .ko
        mkdir -p AnyKernel3/modules/system/lib/modules
        find kernel-source/drivers -type f -name "*.ko" -exec cp {} AnyKernel3/modules/system/lib/modules/ \;
        
        # Masuk ke direktori kerja AnyKernel3 untuk konfigurasi skrip
        cd AnyKernel3
        
        # Modifikasi properti internal anykernel.sh untuk kompatibilitas J1 Ace
        sed -i 's/block=\/dev\/block\/bootdevice\/by-name\/boot;/block=auto;/g' anykernel.sh
        sed -i 's/is_slot_device=0;/is_slot_device=auto;/g' anykernel.sh
        
        # --- SUNTIK PARAMETER CMDLINE UNTUK MEMAKSA SELINUX PERMISSIVE ---
        sed -i 's/cmdline=/cmdline=androidboot.selinux=permissive/g' anykernel.sh
        
        # Kompres seluruh struktur direktori menjadi berkas flashable zip siap pakai
        ZIP_NAME="AnyKernel3-J1-Ace-Permissive-$(date +'%Y%m%d_%H%M').zip"
        zip -r9 "../$ZIP_NAME" * -x .git*
        
        # Ekspor nama berkas zip ke environment variable GitHub Actions
        echo "KERNEL_ZIP=$ZIP_NAME" >> $GITHUB_ENV

    - name: 7. Dapatkan Tanggal & Jam untuk Tag
      run: echo "BUILD_DATE=$(date +'%Y%m%d_%H%M')" >> $GITHUB_ENV

    - name: 8. Upload ke GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: Build-${{ env.BUILD_DATE }}
        name: Kernel J1 Ace [Build ${{ env.BUILD_DATE }}]
        body: |
          **Hasil Build Otomatis Flashable Zip Kernel Samsung J1 Ace**
          
          - **Status**: Sukses Terkompilasi via GitHub Actions
          - **Keamanan**: SELinux Permissive / Knox Disabled (Bypass Bootloop)
          - **Engine Pengemas**: AnyKernel3 (Flashable Zip)
          - **Isi Berkas**: File biner `zImage` dan modul driver perangkat (.ko) terintegrasi otomatis.
        files: ${{ env.KERNEL_ZIP }}
