name: Build Kernel J1 Ace (Anti-Gagal)

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - android-5.1.1 # Menambahkan branch Anda agar otomatis terbaca

env:
  DEFCONFIG_NAME: j1acevelte_defconfig
  ARCH: arm
  SUBARCH: arm

jobs:
  build:
    name: Compile Kernel
    runs-on: ubuntu-22.04 # <-- INI KUNCI FIX-NYA (Diganti ke versi server yang tersedia)

    steps:
    - name: 1. Checkout Kernel Source
      uses: actions/checkout@v4 # Diperbarui ke v4 (standar terbaru GitHub)
      with:
        path: kernel-source

    - name: 2. Install Dependencies (Bahan Bangunan)
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32z1-dev liblz4-tool libncurses5 libncurses-dev libssl-dev libxml2 libxml2-utils lzop rsync schedtool xsltproc zip zlib1g-dev python2 python-is-python3

    - name: 3. Download Toolchain (GCC 4.9 untuk Kernel Jadul)
      run: |
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-eabi-4.9.git toolchain

    - name: 4. Auto-Patch Fixer (Trik Anti-Gagal)
      run: |
        cd kernel-source
        echo "Menjalankan perbaikan otomatis untuk kernel lawas..."
        
        if [ -f kernel/timeconst.pl ]; then
          sed -i 's/if (!defined(@val))/if (!@val)/g' kernel/timeconst.pl
        fi
        
        if [ -f scripts/dtc/dtc-lexer.lex.c_shipped ]; then
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.lex.c_shipped
        fi
        
        sed -i 's/-Werror//g' Makefile
        sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/g' arch/arm/configs/$DEFCONFIG_NAME

    - name: 5. Mulai Compile Kernel
      run: |
        cd kernel-source
        export CROSS_COMPILE=$GITHUB_WORKSPACE/toolchain/bin/arm-eabi-
        export ARCH=arm
        export SUBARCH=arm
        export KBUILD_BUILD_USER="Icsriyand"
        export KBUILD_BUILD_HOST="GitHub-Actions"
        
        make clean && make mrproper
        make $DEFCONFIG_NAME
        make -j$(nproc)

    - name: 6. Upload Hasil Kernel (zImage)
      uses: actions/upload-artifact@v4 # Diperbarui ke v4
      with:
        name: zImage-J1-Ace
        path: kernel-source/arch/arm/boot/zImage
        
    - name: 7. Upload Hasil Modul WiFi/Driver (.ko)
      uses: actions/upload-artifact@v4 # Diperbarui ke v4
      with:
        name: Modules-J1-Ace
        path: kernel-source/drivers/**/*.ko
