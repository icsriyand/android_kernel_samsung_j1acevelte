name: Build Kernel J1 Ace (Auto-Release)

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - android-5.1.1

permissions:
  contents: write

env:
  DEFCONFIG_NAME: j1acevelte_defconfig
  ARCH: arm
  SUBARCH: arm

jobs:
  build:
    name: Compile Kernel
    runs-on: ubuntu-22.04

    steps:
    - name: 1. Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        path: kernel-source

    - name: 2. Checkout AnyKernel3 (Untuk Flashable Zip)
      uses: actions/checkout@v4
      with:
        repository: osm0sis/AnyKernel3
        path: AnyKernel3

    - name: 3. Install Dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32z1-dev liblz4-tool libncurses5 libncurses-dev libssl-dev libxml2 libxml2-utils lzop rsync schedtool xsltproc zip zlib1g-dev python2 libc6:i386 libncurses5:i386 libstdc++6:i386
        sudo ln -sf /usr/bin/python2 /usr/bin/python

    - name: 4. Download Toolchain
      run: |
        git clone --depth=1 -b lineage-18.1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git toolchain

    - name: 5. Auto-Patch, Set Permissive & Disable Samsung Security
      run: |
        cd kernel-source
        # Fix error bawaan
        if [ -f kernel/timeconst.pl ]; then sed -i 's/if (!defined(@val))/if (!@val)/g' kernel/timeconst.pl; fi
        if [ -f scripts/dtc/dtc-lexer.lex.c_shipped ]; then sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.lex.c_shipped; fi
        find . -type f -name "Makefile" -exec sed -i 's/-Werror//g' {} +
        find . -type f -name "Makefile" -exec sed -i 's/-implicit-function-declaration/-Wno-implicit-function-declaration/g' {} +
        
        # Disable Security & Set Permissive
        echo "CONFIG_SECURITY_SELINUX_DEVELOP=y" >> arch/arm/configs/$DEFCONFIG_NAME
        echo "CONFIG_SECURITY_SELINUX_AVC_STATS=y" >> arch/arm/configs/$DEFCONFIG_NAME
        sed -i 's/CONFIG_SECURITY_SELINUX_ENFORCE_PERMISSIVE=n/CONFIG_SECURITY_SELINUX_ENFORCE_PERMISSIVE=y/g' arch/arm/configs/$DEFCONFIG_NAME || echo "CONFIG_SECURITY_SELINUX_ENFORCE_PERMISSIVE=y" >> arch/arm/configs/$DEFCONFIG_NAME
        sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/g' arch/arm/configs/$DEFCONFIG_NAME
        # Disable Samsung specific security
        sed -i 's/CONFIG_SEC_RESTRICT_ROOT=y/# CONFIG_SEC_RESTRICT_ROOT is not set/g' arch/arm/configs/$DEFCONFIG_NAME
        sed -i 's/CONFIG_KNOX_KAP=y/# CONFIG_KNOX_KAP is not set/g' arch/arm/configs/$DEFCONFIG_NAME

    - name: 6. Compile Kernel
      run: |
        cd kernel-source
        export CROSS_COMPILE=$GITHUB_WORKSPACE/toolchain/bin/arm-linux-androideabi-
        export ARCH=arm
        export SUBARCH=arm
        export KBUILD_BUILD_USER="Icsriyand"
        export KBUILD_BUILD_HOST="GitHub-Actions"
        make $DEFCONFIG_NAME
        make -j$(nproc)

    - name: 7. Pack to AnyKernel3
      run: |
        cp kernel-source/arch/arm/boot/zImage AnyKernel3/
        # Jika ada dtb, copy juga (opsional, sesuaikan lokasi jika perlu)
        if [ -f kernel-source/arch/arm/boot/dt.img ]; then cp kernel-source/arch/arm/boot/dt.img AnyKernel3/; fi
        cd AnyKernel3
        zip -r9 ../Kernel-J1-Ace-Flashable.zip *

    - name: 8. Upload to Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: Build-${{ github.run_id }}
        name: Kernel J1 Ace [Permissive & Security Disabled]
        body: "Hasil Build Otomatis: Kernel sudah diset ke mode Permissive dan proteksi Samsung (Knox/Root Restrictions) telah dinonaktifkan."
        files: Kernel-J1-Ace-Flashable.zip
